<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Appointments</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 30px;
    background: #f1f5f9;
    color: #1e293b;
}

h1 {
    color: #176b87;
    margin-bottom: 8px;
}

p {
    color: #64748b;
}

.table-wrap {
    overflow-x: auto;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #176b87;
    color: white;
}
    </style>
</head>
<body>
    <h1>DoctorCare — Appointments</h1>
    <p>Recent appointment bookings</p>

    {% if appointments %}
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                {% for a in appointments %}
                <tr>
                    {% for value in a %}
                    <td>{{ value }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p>No appointments found.</p>
    {% endif %}
</body>
</html>
