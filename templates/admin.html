<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Appointments</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 30px;
    background: #f1f5f9;
    color: #1e293b;
}

h1 {
    color: #176b87;
    margin-bottom: 8px;
}

p {
    color: #64748b;
}

.table-wrap {
    overflow-x: auto;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #176b87;
    color: white;
}
.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 20px 0;
}

.filters input,
.filters select {
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
}

.filters input {
    flex: 1;
    min-width: 220px;
}

.filters select {
    background: white;
}

tbody tr:hover {
    background: #f8fafc;
}
    </style>
</head>
<body>
    <form action="/logout" method="POST"
      onsubmit="return confirm('Kya aap logout karna chahte hain?');"
      style="text-align:right; margin-bottom:20px;">
    <button type="submit"
            style="background:#dc2626; color:white; padding:10px 18px; border:0; border-radius:6px; cursor:pointer;">
        Logout
    </button>
</form>
    <h1>DoctorCare — Appointments</h1>
    <p>Recent appointment bookings</p>
    <div class="filters">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, email, phone..."
    >

    <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Completed">Completed</option>
    </select>
</div>

    {% if appointments %}
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th> 
                    <th>Status</th>  
                </tr>
            </thead>
            <tbody>
                {% for a in appointments %}
<tr>
    {% for value in a[:7] %}
    <td>{{ value }}</td>
    {% endfor %}

    <td>
        <form action="/update_status" method="POST">
            <input type="hidden" name="appointment_id" value="{{ a[0] }}">

            <select name="status">
                <option value="Pending" {% if a[7] == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Confirmed" {% if a[7] == 'Confirmed' %}selected{% endif %}>Confirmed</option>
                <option value="Completed" {% if a[7] == 'Completed' %}selected{% endif %}>Completed</option>
            </select>

            <button type="submit">Update</button>
        </form>
        <form action="/delete_appointment" method="POST"
      onsubmit="return confirm('Kya aap is appointment ko delete karna chahte hain?');">
    <input type="hidden" name="appointment_id" value="{{ a[0] }}">
    <button type="submit" style="background:#dc2626;color:white;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;">
        Delete
    </button>
</form>
    </td>
</tr>
{% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p>No appointments found.</p>
    {% endif %}
    <script>
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");

function filterAppointments() {
    const search = searchInput.value.toLowerCase().trim();
    const status = statusFilter.value;

    document.querySelectorAll("tbody tr").forEach(row => {
        const text = row.innerText.toLowerCase();
        const statusSelect = row.querySelector('select[name="status"]');
        const rowStatus = statusSelect ? statusSelect.value : "";

        const matchesSearch = text.includes(search);
        const matchesStatus = !status || rowStatus === status;

        row.style.display =
            matchesSearch && matchesStatus ? "" : "none";
    });
}

searchInput.addEventListener("input", filterAppointments);
statusFilter.addEventListener("change", filterAppointments);
</script>
</body>
</html>
